name: Keep Backend Alive

on:
  schedule:
    # Chạy mỗi 10 phút từ phút thứ 0, 10, 20...
    - cron: '*/10 * * * *'
  workflow_dispatch: # Cho phép chạy thủ công để test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          # Thay URL của bạn vào đây hoặc dùng GitHub Secrets
          URL="https://your-backend-name.onrender.com/api/v1/health"
          echo "Pinging $URL..."
          curl -s -o /dev/null -w "%{http_code}" "$URL" | grep -q "200" || (echo "Ping failed with code $?" && exit 0)
          echo "Ping successful!"
