# ============================================
# OKABE — Application Configuration (Production)
# ============================================

spring:
  datasource:
    # Aiven MySQL: SPRING_DATASOURCE_URL phải có dạng:
    # jdbc:mysql://<host>:<port>/<db>?ssl-mode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      pool-name: OkabeHikariCP

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 25
          fetch_size: 100
        order_inserts: true
        order_updates: true
        query:
          fail_on_pagination_over_collection_fetch: true

server:
  port: ${PORT:8080}
  error:
    whitelabel:
      enabled: false
  tomcat:
    threads:
      max: 10
      min-spare: 2
    accept-count: 50
    max-connections: 20

app:
  url: ${APP_URL}
  email:
    provider: ${EMAIL_PROVIDER:smtp}
    from: ${MAIL_FROM:${SPRING_MAIL_USERNAME:noreply@okabe.com}}
    resend:
      api-key: ${RESEND_API_KEY:}
  jwt:
    secret: ${JWT_SECRET}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
  storage:
    type: ${APP_STORAGE_TYPE:cloudinary}
  ai:
    groq:
      api-key: ${GROQ_API_KEY}
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}
