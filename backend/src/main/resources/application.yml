# ============================================
# OKABE — Application Configuration (Default)
# ============================================

spring:
  application:
    name: okabe-backend
  profiles:
    default: dev

  # Datasource Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/okabe_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:okabe}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # Mail Configuration
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

  # Thymeleaf Configuration for Email Templates
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

# Server
server:
  port: 8080
  servlet:
    context-path: /

# App Config
app:
  url: ${APP_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:okabe-default-secret-key-change-me-in-production-please-256-bits}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:*}
  google:
    client-id: ${GOOGLE_CLIENT_ID:620325554164-7mp2l3l2jhcqk5gfh52nnr103523tlt3.apps.googleusercontent.com}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  storage:
    type: ${APP_STORAGE_TYPE:local}
  ai:
    groq:
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}
      max-tokens: ${AI_MAX_TOKENS:1000}

# Springdoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
# Logging Configuration
logging:
  config: classpath:logback-spring.xml
  level:
    # Business logic
    com.okabe: INFO
    com.okabe.service.GeminiProvider: DEBUG
    com.okabe.service.AiContextBuilder: WARN
    # Framework: WARN only (no spam)
    org.springframework: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.flywaydb: WARN
    org.apache: WARN
    com.zaxxer.hikari: WARN
