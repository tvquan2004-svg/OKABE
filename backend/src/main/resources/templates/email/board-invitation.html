<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 20px auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { background-color: #10b981; padding: 20px; text-align: center; color: #ffffff; }
        .content { padding: 30px; line-height: 1.6; color: #333333; }
        .btn { display: inline-block; padding: 12px 24px; background-color: #10b981; color: #ffffff !important; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 20px; }
        .footer { background-color: #f9fafb; padding: 20px; text-align: center; font-size: 12px; color: #6b7280; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>OKABE</h1>
        </div>
        <div class="content">
            <p>Xin chào <span th:text="${recipientName}">User</span>,</p>
            <p><span th:text="${inviterName}">Someone</span> đã thêm bạn vào bảng công việc: <strong><span th:text="${boardName}">Board Name</span></strong>.</p>
            <p>Bây giờ bạn có thể cùng cộng tác trong bảng này.</p>
            <a th:href="${boardUrl}" class="btn">Xem bảng công việc</a>
        </div>
        <div class="footer">
            <p>Bạn nhận được email này vì đã được thêm vào một bảng công việc trên OKABE.</p>
        </div>
    </div>
</body>
</html>
