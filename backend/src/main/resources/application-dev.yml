# ============================================
# OKABE — Development Profile
# ============================================

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/okabe_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

app:
  url: ${APP_URL:http://localhost:5173}
  email:
    provider: ${EMAIL_PROVIDER:smtp}
    from: ${MAIL_FROM:${SPRING_MAIL_USERNAME:noreply@okabe.com}}
    resend:
      api-key: ${RESEND_API_KEY:}
  mail:
    from: ${SPRING_MAIL_USERNAME:noreply@okabe.com}

# Logging: handled by logback-spring.xml + application.yml
# show-sql=false kills Hibernate: stdout (bypasses logback)
# Do NOT re-enable DEBUG here unless debugging specific issues
