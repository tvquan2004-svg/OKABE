services:
  # --- MySQL Database ---
  mysql:
    image: mysql:8.0
    container_name: okabe-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: okabe_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-okabe}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - okabe-net

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5

  # --- Redis Cache ---
  redis:
    image: redis:7.0-alpine
    container_name: okabe-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - okabe-net


  # --- Spring Boot Backend ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: okabe-backend
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/okabe_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-okabe}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123456}
      DB_USERNAME: ${DB_USERNAME:-okabe}
      DB_PASSWORD: ${DB_PASSWORD:-123456}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # Email Configuration (Uses Gmail if not specified)
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_STARTTLS:-true}

      APP_URL: ${APP_URL:-http://localhost:5173}

      JWT_SECRET: your_very_strong_and_long_jwt_secret_key_here

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_started

    networks:
      - okabe-net

  # --- Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: okabe-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1

    depends_on:
      - backend

    networks:
      - okabe-net

volumes:
  mysql_data:
  redis_data:

networks:
  okabe-net:
    driver: bridge