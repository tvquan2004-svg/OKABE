<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>OKABE — Test Scheduler</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 16px; }
    button { background: #6366f1; color: white; border: none; padding: 14px 32px; border-radius: 8px; font-size: 16px; cursor: pointer; }
    button:hover { background: #4f46e5; }
    #result { background: #1e293b; padding: 16px; border-radius: 8px; min-width: 400px; white-space: pre-wrap; font-family: monospace; font-size: 13px; }
  </style>
</head>
<body>
  <h2>🔔 OKABE Scheduler Test</h2>
  <button onclick="trigger()">▶ Trigger Due-Date Email Scheduler</button>
  <div id="result">Nhấn nút để kích hoạt scheduler...</div>

  <script>
    async function trigger() {
      document.getElementById('result').textContent = 'Đang gửi request...';
      try {
        const res = await fetch('http://localhost:8080/api/v1/admin/test/trigger-due-soon', { method: 'POST' });
        const json = await res.json();
        document.getElementById('result').textContent = '✅ Response:\n' + JSON.stringify(json, null, 2);
      } catch (e) {
        document.getElementById('result').textContent = '❌ Lỗi: ' + e.message;
      }
    }
  </script>
</body>
</html>
